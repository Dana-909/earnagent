<!doctype html><html><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>EarnAgent — Verify payment</title><style>body{font:16px system-ui;max-width:760px;margin:auto;padding:24px;background:#101820;color:#f5f1e8}button{padding:12px 16px;border:0;border-radius:10px;cursor:pointer}code{overflow-wrap:anywhere}.ok{padding:16px;background:#193b2b;border-radius:12px}.bad{padding:16px;background:#3b2020;border-radius:12px}</style></head><body><h1>Verify USDC payment</h1><p id="p">Loading…</p><button id="v">Verify transaction</button><div id="out"></div><script>
const W="0x948B78F80ba73E846B27171f31E3609b0e399701".toLowerCase(), T="0xddf252ad1be2c89b69c2b068fc378daa952ba7f163c4a11628f55aeb2a5b4e5";
const N={base:["Base",8453,"https://mainnet.base.org","0x833589fCD6eDb6E08f4c7C32D4f71b54bdA02913"],arbitrum:["Arbitrum One",42161,"https://arb1.arbitrum.io/rpc","0xaf88d065e77c8cC2239327C5EDb3A432268e5831"],polygon:["Polygon PoS",137,"https://polygon-rpc.com","0x3c499c542cef5e3811e1192ce70d8cc03d5c3359"],optimism:["Optimism",10,"https://mainnet.optimism.io","0x0b2C639c533813f4Aa9D7837CAf62653d097Ff85"]};
const prices={"freelancer-invoice-kit":7,"small-business-kpi-dashboard":9,"content-calendar-kit":5,"job-application-tracker":4,"svg-social-icon-pack":6,"project-planning-kit":8};
const q=new URLSearchParams(location.search), product=q.get("product")||"", tx=q.get("tx")||"", net=q.get("network")||"base"; document.getElementById("p").textContent=product+" — $"+(prices[product]||"?")+" USDC"; if(tx) document.getElementById("out").innerHTML="<p>Transaction supplied. Click verify.</p>";
async function rpc(url,method,params){let r=await fetch(url,{method:"POST",headers:{"content-type":"application/json"},body:JSON.stringify({jsonrpc:"2.0",id:1,method,params})});return (await r.json()).result}
document.getElementById("v").onclick=async()=>{let hash=q.get("tx")||prompt("Paste the USDC transaction hash"); if(!hash)return; let n=N[net]; try{let receipt=await rpc(n[2],"eth_getTransactionReceipt",[hash]); if(!receipt||!receipt.logs)throw Error("Transaction not found"); let ok=receipt.logs.some(x=>x.address.toLowerCase()===n[3].toLowerCase()&&x.topics&&x.topics[0].toLowerCase()===T&&x.topics[2]&&("0x"+x.topics[2].slice(-40)).toLowerCase()===W&&parseInt(x.data,16)===Math.round((prices[product]||0)*1e6)); if(!ok)throw Error("No matching USDC payment found"); document.getElementById("out").innerHTML='<div class="ok"><b>Payment verified on-chain.</b><p><a href="products/'+product+'.html">Open your product</a></p></div>'}catch(e){document.getElementById("out").innerHTML='<div class="bad">'+e.message+"</div>"}};</script><script>const PAYMENT_INTENT_KEY="earnagent_payment_intent";function newPaymentIntent(product,network,amount){const intent={id:crypto.randomUUID(),product,network,amount,created_at:new Date().toISOString(),status:"awaiting_payment"};localStorage.setItem(PAYMENT_INTENT_KEY,JSON.stringify(intent));return intent}</script></body></html>
