<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Car Monthly Cost Calculator — DealPilot</title><meta name="description" content="Calculate the real monthly cost of car ownership including payment, insurance, fuel and maintenance."><style>body{font:16px system-ui;margin:0;background:#f6f7fb;color:#18202a}main{max-width:760px;margin:auto;padding:30px 20px}.box{background:white;border:1px solid #ddd;border-radius:18px;padding:22px}label{display:block;margin:13px 0 5px}input{width:100%;box-sizing:border-box;padding:12px;border:1px solid #bbb;border-radius:10px;font-size:16px}.result{font-size:27px;font-weight:700}</style></head><body><main><a href="index.html">← DealPilot</a><h1>Real Car Monthly Cost</h1><p>Don't compare cars by the loan payment alone.</p><div class="box"><label>Loan/payment per month</label><input id="a" type="number" value="450"><label>Insurance per month</label><input id="b" type="number" value="130"><label>Fuel per month</label><input id="c" type="number" value="180"><label>Maintenance reserve per month</label><input id="d" type="number" value="100"><label>Parking/tolls per month</label><input id="e" type="number" value="50"><p class="result" id="r"></p></div><script>document.querySelectorAll('input').forEach(x=>x.addEventListener('input',calc));function calc(){let s=[...document.querySelectorAll('input')].reduce((a,x)=>a+(+x.value||0),0);r.textContent='Real estimated monthly cost: $'+s.toFixed(2)}calc();</script></main></body></html>
