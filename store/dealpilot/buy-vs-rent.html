<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Buy vs Rent Calculator — DealPilot</title><meta name="description" content="Simple buy versus rent calculator for comparing recurring rent with ownership costs."><style>body{font:16px system-ui;margin:0;background:#f6f7fb;color:#18202a}main{max-width:760px;margin:auto;padding:30px 20px}.box{background:white;border:1px solid #ddd;border-radius:18px;padding:22px}label{display:block;margin:13px 0 5px}input{width:100%;box-sizing:border-box;padding:12px;border:1px solid #bbb;border-radius:10px;font-size:16px}.result{font-size:27px;font-weight:700}</style></head><body><main><a href="index.html">← DealPilot</a><h1>Buy vs Rent Calculator</h1><p>Compare the simple cash cost over your chosen period.</p><div class="box"><label>Monthly rent</label><input id="r" type="number" value="1200"><label>Monthly ownership cost</label><input id="o" type="number" value="1500"><label>Years</label><input id="y" type="number" value="5"><p class="result" id="x"></p></div><script>document.querySelectorAll('input').forEach(x=>x.addEventListener('input',calc));function calc(){let r=+R('r'),o=+R('o'),y=+R('y'),n=y*12;x.textContent=(r<o?'Renting':'Owning')+' is lower by $'+Math.abs(r-o)*n.toFixed(2)+' over '+y+' years in this simple cash-flow comparison.'}function R(id){return document.getElementById(id).value}calc();</script></main></body></html>
