<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Phone Total Cost Calculator — DealPilot</title><meta name="description" content="Compare the real 24-month cost of phones, financing, trade-in value and monthly plans."><style>body{font:16px system-ui;margin:0;background:#f6f7fb;color:#18202a}main{max-width:760px;margin:auto;padding:30px 20px}.box{background:white;border:1px solid #ddd;border-radius:18px;padding:22px}label{display:block;margin:13px 0 5px}input{width:100%;box-sizing:border-box;padding:12px;border:1px solid #bbb;border-radius:10px;font-size:16px}.result{font-size:27px;font-weight:700}</style></head><body><main><a href="index.html">← DealPilot</a><h1>Phone Total Cost Calculator</h1><p>Compare what a phone actually costs over 24 months.</p><div class="box"><label>Phone price</label><input id="p" type="number" value="799"><label>Trade-in / credit</label><input id="t" type="number" value="200"><label>Monthly phone-plan cost</label><input id="m" type="number" value="35"><label>Monthly financing cost</label><input id="x" type="number" value="0"><p class="result" id="r"></p></div><script>document.querySelectorAll('input').forEach(x=>x.addEventListener('input',calc));function calc(){let p=+P('p'),t=+P('t'),m=+P('m'),x=+P('x');let total=p-t+24*(m+x);document.getElementById('r').textContent='Estimated 24-month cost: $'+total.toFixed(2)}function P(id){return document.getElementById(id).value}calc();</script></main></body></html>
