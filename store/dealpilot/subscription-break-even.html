<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Subscription Break-Even Calculator — DealPilot</title><meta name="description" content="Free subscription break-even calculator. Compare monthly and annual plans including discounts and fees."><style>body{font:16px system-ui;margin:0;background:#f6f7fb;color:#18202a}main{max-width:760px;margin:auto;padding:30px 20px}.box{background:white;border:1px solid #ddd;border-radius:18px;padding:22px;margin:16px 0}label{display:block;margin:14px 0 5px}input{width:100%;box-sizing:border-box;padding:12px;border:1px solid #bbb;border-radius:10px;font-size:16px}.result{font-size:28px;font-weight:700}.back{display:inline-block;margin-bottom:20px}</style></head><body><main><a class="back" href="index.html">← DealPilot</a><h1>Subscription Break-Even Calculator</h1><p>Find out when an annual subscription becomes cheaper than paying monthly.</p><div class="box"><label>Monthly price</label><input id="m" type="number" value="20" min="0" step=".01"><label>Annual price</label><input id="a" type="number" value="180" min="0" step=".01"><label>Annual extra fees</label><input id="f" type="number" value="0" min="0" step=".01"><p class="result" id="r"></p><p id="d"></p></div><script>const ids=['m','a','f'];ids.forEach(x=>document.getElementById(x).addEventListener('input',calc));function calc(){let m=+document.getElementById('m').value,a=+document.getElementById('a').value,f=+document.getElementById('f').value;let monthly=m*12,annual=a+f,s=monthly-annual;document.getElementById('r').textContent=(s>=0?'Annual saves $':'Monthly saves $')+Math.abs(s).toFixed(2)+' per year';let months=a/m;document.getElementById('d').textContent=m>0?'The annual plan breaks even after '+months.toFixed(1)+' months of monthly payments.':''}calc();</script></main></body></html>
