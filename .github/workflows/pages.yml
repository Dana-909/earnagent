name: EarnAgent autonomous cycle
on:
  push:
    branches: [main]
  workflow_dispatch:
  schedule:
    - cron: '17 * * * *'
permissions:
  contents: read
  pages: write
  id-token: write
concurrency:
  group: earnagent
  cancel-in-progress: true
jobs:
  run:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install Taskmarket CLI
        run: npm install -g @lucid-agents/taskmarket@latest
      - name: Verify Taskmarket CLI
        run: taskmarket --help >/dev/null
      - name: Restore persistent Taskmarket identity
        env:
          TASKMARKET_IMPORT_KEY: ${{ secrets.TASKMARKET_AGENT_PRIVATE_KEY }}
        run: |
          if [ -z "$TASKMARKET_IMPORT_KEY" ]; then
            echo "::notice::TASKMARKET_AGENT_PRIVATE_KEY is not configured; discovery stays read-only."
          else
            taskmarket wallet import
            unset TASKMARKET_IMPORT_KEY
            echo "Taskmarket wallet imported into encrypted keystore."
            taskmarket address
            taskmarket identity status
            taskmarket legal status
          fi
      - name: Inspect Taskmarket work
        run: |
          taskmarket task list --status open --limit 100 | tee taskmarket_live.json
          test -s taskmarket_live.json
          python3 - <<'PY'
          import json
          d=json.load(open("taskmarket_live.json"))
          rows=d.get("data", d) if isinstance(d,dict) else d
          if isinstance(rows,dict):
              rows=rows.get("tasks") or rows.get("items") or []
          rows=rows if isinstance(rows,list) else []
          modes={}
          for t in rows:
              m=str(t.get("mode","unknown")).lower()
              modes[m]=modes.get(m,0)+1
          print({"open_tasks":len(rows),"modes":modes})
          PY
      - name: Verify Taskmarket live submission preconditions
        run: |
          python3 - <<'PY'
          import json, subprocess
          d=json.load(open("taskmarket_live.json"))
          rows=d.get("data",d) if isinstance(d,dict) else d
          if isinstance(rows,dict): rows=rows.get("tasks") or []
          safe=[]
          for t in rows:
              desc=(t.get("description") or "").lower()
              if t.get("mode")!="bounty" or not t.get("submissionWindowOpen"): continue
              if t.get("stakeRequired"): continue
              # Only self-contained single-file work with no account, purchase, or mandated external model.
              if ("one self-contained offline html file" in desc or "one self-contained static svg" in desc) and not any(x in desc for x in ("claude opus","purchase","sign in with","api key")):
                  p=subprocess.run(["taskmarket","task","get",t["id"]],capture_output=True,text=True)
                  try:
                      detail=json.loads(p.stdout)
                      actions=(detail.get("data") or {}).get("pendingActions") or []
                      submit=[a for a in actions if a.get("role")=="worker" and a.get("action")=="submit" and not a.get("requiresPayment")]
                      if submit: safe.append({"id":t["id"],"referenceCode":t.get("referenceCode"),"reward":t.get("reward"),"command":submit[0].get("command")})
                  except Exception: pass
          json.dump({"safe_free_submit_candidates":safe},open("taskmarket_preflight.json","w"),separators=(",",":"))
          print({"safe_free_submit_candidates":len(safe),"refs":[x["referenceCode"] for x in safe]})
          PY
      - name: Validate and submit verified pupil-atlas bounty
        env:
          TASK_ID: 0x1d63afca637422566509350819d66be837192535849240bed49104258cd45a49
          AGENT_ADDRESS: 0x948B78F80ba73E846B27171f31E3609b0e399701
          DELIVERABLE: deliverables/natures_strange_eyes.svg
        run: |
          python3 - <<'PY'
          import os,re,xml.etree.ElementTree as ET
          p=os.environ["DELIVERABLE"]; raw=open(p,"rb").read(); text=raw.decode()
          assert len(raw)<=500000
          ET.fromstring(text)
          assert text.count('id="entry-')==5
          assert all(x in text for x in ["Felis catus","Capra hircus","Equus caballus","Panthera tigris","Sepia bandensis"])
          assert "SCHEMATIC CAVEAT" in text and "<title" in text and "<desc" in text
          assert "<script" not in text.lower() and "<foreignObject" not in text
          assert len(re.findall(r'https://',text))>=5
          print({"svg_valid":True,"bytes":len(raw),"entries":5})
          PY
          taskmarket task get "$TASK_ID" > task_pre_submit.json
          python3 - <<'PY'
          import json,os,sys
          d=json.load(open("task_pre_submit.json")); x=d.get("data") or {}
          acts=x.get("pendingActions") or []
          ok=any(a.get("role")=="worker" and a.get("action")=="submit" and not a.get("requiresPayment") and (not a.get("eligibleAddress") or a.get("eligibleAddress","").lower()==os.environ["AGENT_ADDRESS"].lower()) for a in acts)
          if not (ok and x.get("submissionWindowOpen") is True):
              print("Submission gate closed or paid; skipping safely."); sys.exit(20)
          PY
          taskmarket task submissions "$TASK_ID" > existing_submissions.json
          if python3 - <<'PY'
          import json,os,sys
          d=json.load(open("existing_submissions.json")); rows=d.get("data") or []
          found=any((r.get("workerAddress") or "").lower()==os.environ["AGENT_ADDRESS"].lower() for r in rows)
          print({"already_submitted_by_agent":found})
          sys.exit(0 if found else 1)
          PY
          then
            echo "Existing EarnAgent submission found; no duplicate."
          else
            taskmarket task get "$TASK_ID" > task_final_gate.json
            python3 - <<'PY'
          import json,os
          x=(json.load(open("task_final_gate.json")).get("data") or {})
          acts=x.get("pendingActions") or []
          assert x.get("submissionWindowOpen") is True
          assert any(a.get("role")=="worker" and a.get("action")=="submit" and not a.get("requiresPayment") and (not a.get("eligibleAddress") or a.get("eligibleAddress","").lower()==os.environ["AGENT_ADDRESS"].lower()) for a in acts)
          PY
            taskmarket task submit "$TASK_ID" --file "$DELIVERABLE" | tee taskmarket_submission.json
            taskmarket task submissions "$TASK_ID" > submissions_after.json
            python3 - <<'PY'
          import json,os
          rows=json.load(open("submissions_after.json")).get("data") or []
          mine=[r for r in rows if (r.get("workerAddress") or "").lower()==os.environ["AGENT_ADDRESS"].lower()]
          assert mine, "submission not confirmed"
          print({"submission_confirmed":True,"submission_id":mine[-1].get("id")})
          PY
          fi
      - name: Run safety tests
        run: python3 -m unittest -v test_worker.py test_verifier.py test_submitter.py test_ledger.py test_runner.py
      - name: Validate end-to-end safety orchestration
        run: python3 runner.py
      - name: Run autonomous earning scout
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          BOUNTY_AGENT_API_KEY: ${{ secrets.BOUNTY_AGENT_API_KEY }}
        run: python3 scanner.py
      - uses: actions/configure-pages@v5
        with:
          enablement: true
      - uses: actions/upload-pages-artifact@v4
        with:
          path: .
      - id: deployment
        uses: actions/deploy-pages@v4
