name: EarnAgent autonomous cycle
on:
  push:
    branches: [main]
  workflow_dispatch:
  schedule:
    - cron: '2/5 * * * *'
permissions:
  contents: read
  pages: write
  id-token: write
concurrency:
  group: earnagent
  cancel-in-progress: false
jobs:
  run:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - name: Restore persistent payment ledger
        uses: actions/cache/restore@v6
        with:
          path: data/base_payments.json
          key: earnagent-payments-${{ github.run_id }}
          restore-keys: |
            earnagent-payments-
      - name: Self-heal generated runtime scripts
        run: |
          python3 - <<'PY'
          from pathlib import Path
          p=Path("sales_engine.py")
          s=p.read_text()
          bad='    xml=["<?xml version="1.0" encoding="UTF-8"?>","<urlset xmlns="http://www.sitemaps.org/schemas/sitemap/0.9">"]'
          good='    xml=[\'<?xml version="1.0" encoding="UTF-8"?>\',\'<urlset xmlns="http://www.sitemaps.org/schemas/sitemap/0.9">\']'
          if bad in s:
              p.write_text(s.replace(bad,good))
          compile(p.read_text(),"sales_engine.py","exec")
          q=Path("scanner.py")
          ss=q.read_text()
          if "scout_channel_strategy(name, rows)" not in ss:
              ss=ss.replace("  for i in rows:\n","  scout_channel_strategy(name, rows)\n  for i in rows:\n",1)
              q.write_text(ss)
          compile(q.read_text(),"scanner.py","exec")
          PY
      - name: Scout Circle x402 agent revenue market
        continue-on-error: true
        run: |
          python3 agent_revenue_scout.py | tee agent_revenue_scout_run.json
          test -s data/agent_revenue_market.json
      - name: Scout Agent Souk paid demand
        continue-on-error: true
        run: |
          python3 agent_souk_scout.py | tee agent_souk_scout_run.json
          test -s data/agent_souk_market.json
      - name: Restore Agent Souk state
        uses: actions/cache/restore@v6
        with:
          path: data/agentsouk_state.json
          key: earnagent-agentsouk-state-${{ github.run_id }}
          restore-keys: |
            earnagent-agentsouk-state-
      - name: Run autonomous Agent Souk seller
        continue-on-error: true
        env:
          AGENTSOUK_API_KEY: ${{ secrets.AGENTSOUK_API_KEY }}
          EARNAGENT_AGENT_PRIVATE_KEY: ${{ secrets.EARNAGENT_AGENT_PRIVATE_KEY }}
          TASKMARKET_AGENT_PRIVATE_KEY: ${{ secrets.TASKMARKET_AGENT_PRIVATE_KEY }}
          EARNAGENT_AGENT_WALLET_ADDRESS: ${{ secrets.TASKMARKET_WALLET_ADDRESS }}
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
          EARNAGENT_MODEL: gpt-5.6-luna
        run: |
          python3 -m pip install -q agentsouk eth-account openai
          python3 agentsouk_worker.py | tee agentsouk_worker_run.json
          test -s data/agentsouk_run.json

      - name: Save Agent Souk state
        if: always()
        uses: actions/cache/save@v6
        with:
          path: data/agentsouk_state.json
          key: earnagent-agentsouk-state-${{ github.run_id }}
      - name: Install Taskmarket CLI
        run: npm install -g @lucid-agents/taskmarket@latest
      - name: Verify Taskmarket CLI
        run: taskmarket --help >/dev/null
      - name: Restore persistent Taskmarket identity
        env:
          TASKMARKET_IMPORT_KEY: ${{ secrets.TASKMARKET_AGENT_PRIVATE_KEY }}
        run: |
          if [ -z "$TASKMARKET_IMPORT_KEY" ]; then
            echo "::notice::TASKMARKET_AGENT_PRIVATE_KEY is not configured; discovery stays read-only."
          else
            taskmarket wallet import
            unset TASKMARKET_IMPORT_KEY
            echo "Taskmarket wallet imported into encrypted keystore."
            taskmarket address
            taskmarket identity status
            taskmarket legal status
          fi
      - name: Inspect Taskmarket work
        run: |
          taskmarket task list --status open --limit 100 | tee taskmarket_live.json
          test -s taskmarket_live.json
          python3 - <<'PY'
          import json
          d=json.load(open("taskmarket_live.json"))
          rows=d.get("data", d) if isinstance(d,dict) else d
          if isinstance(rows,dict):
              rows=rows.get("tasks") or rows.get("items") or []
          rows=rows if isinstance(rows,list) else []
          modes={}
          for t in rows:
              m=str(t.get("mode","unknown")).lower()
              modes[m]=modes.get(m,0)+1
          print({"open_tasks":len(rows),"modes":modes})
          PY
      - name: Verify Taskmarket live submission preconditions
        run: |
          python3 - <<'PY'
          import json, subprocess
          d=json.load(open("taskmarket_live.json"))
          rows=d.get("data",d) if isinstance(d,dict) else d
          if isinstance(rows,dict): rows=rows.get("tasks") or []
          safe=[]
          for t in rows:
              desc=(t.get("description") or "").lower()
              if t.get("mode")!="bounty" or not t.get("submissionWindowOpen"): continue
              if t.get("stakeRequired"): continue
              # Only self-contained single-file work with no account, purchase, or mandated external model.
              if (("one self-contained offline html file" in desc or "one self-contained static svg" in desc or ("markdown" in desc and any(x in desc for x in ("article","report","research summary","documentation","readme","essay","plain text","copywriting")))) and not any(x in desc for x in ("claude opus","purchase","sign in with","api key","login","password","external account","send an email","phone call"))):
                  p=subprocess.run(["taskmarket","task","get",t["id"]],capture_output=True,text=True)
                  try:
                      detail=json.loads(p.stdout)
                      actions=(detail.get("data") or {}).get("pendingActions") or []
                      submit=[a for a in actions if a.get("role")=="worker" and a.get("action")=="submit" and not a.get("requiresPayment")]
                      if submit: safe.append({"id":t["id"],"referenceCode":t.get("referenceCode"),"reward":t.get("reward"),"command":submit[0].get("command")})
                  except Exception: pass
          json.dump({"safe_free_submit_candidates":safe},open("taskmarket_preflight.json","w"),separators=(",",":"))
          print({"safe_free_submit_candidates":len(safe),"refs":[x["referenceCode"] for x in safe]})
          PY
      - name: Check office runtime configuration
        env:
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
          TASKMARKET_WALLET_ADDRESS: ${{ secrets.TASKMARKET_WALLET_ADDRESS }}
          LEMONSQUEEZY_API_KEY: ${{ secrets.LEMONSQUEEZY_API_KEY }}
        run: |
          python3 - <<'PY'
          import os
          print({
            "ai_office_enabled": bool(os.environ.get("OPENAI_API_KEY")),
            "taskmarket_wallet_configured": bool(os.environ.get("TASKMARKET_WALLET_ADDRESS")),
            "lemon_squeezy_configured": bool(os.environ.get("LEMONSQUEEZY_API_KEY")),
            "office_pipeline": ["Scout","Strategist","Producer","Auditor","Executor","Fixer"],
          })
          PY
      - name: Run action-first autonomous Taskmarket worker
        env:
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
          EARNAGENT_MODEL: gpt-6-luna
          EARNAGENT_EXECUTOR_MODEL: gpt-6-luna
          EARNAGENT_FRONTIER_MODEL: gpt-6-sol
          EARNAGENT_MAX_ACTIONS: "24"
          EARNAGENT_MAX_AI: "10"
          EARNAGENT_PAID_ACTIONS_APPROVED: "true"
        run: python3 taskmarket_active.py
      - name: Report action-first result
        run: |
          echo '--- taskmarket_active.json ---'
          cat data/taskmarket_active.json
          echo '--- end ---'
      - name: Run autonomous Taskmarket worker
        env:
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
          EARNAGENT_MODEL: gpt-5.6-luna
        run: python3 taskmarket_worker.py
      - name: Verify direct Base USDC sales
        continue-on-error: true
        env:
          EARNAGENT_SALES_WALLET_ADDRESS: ${{ secrets.TASKMARKET_WALLET_ADDRESS }}
        run: |
          python3 base_payment_verifier.py | tee base_payment_run.json
          test -s data/base_payments.json
      - name: Save persistent payment ledger
        uses: actions/cache/save@v6
        with:
          path: data/base_payments.json
          key: earnagent-payments-${{ github.run_id }}
      - name: Build Max Vector creator content
        run: |
          python3 persona_engine.py | tee persona_engine_run.json
          test -s content/persona.json
          test -s content/publish_queue.json

      - name: Build autonomous sales catalog
        env:
          TASKMARKET_WALLET_ADDRESS: ${{ secrets.TASKMARKET_WALLET_ADDRESS }}
          LEMONSQUEEZY_API_KEY: ${{ secrets.LEMONSQUEEZY_API_KEY }}
        run: |
          python3 sales_engine.py | tee sales_engine_run.json
          test -s data/sales_engine.json
      - name: Build free-to-paid revenue funnel
        run: python3 revenue_funnel.py
      - name: Update sales experiments
        run: |
          python3 sales_optimizer.py | tee sales_optimizer_run.json
          test -s data/sales_experiments.json
      - name: Render multi-network USDC checkout
        run: python3 multichain_store_overlay.py
      - name: Run safety tests
        run: python3 -m unittest -v test_worker.py test_verifier.py test_submitter.py test_ledger.py test_runner.py test_taskmarket_worker.py test_taskmarket_active.py test_sales_engine.py
      - name: Validate end-to-end safety orchestration
        run: python3 runner.py
      - name: Run autonomous earning scout
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          BOUNTY_AGENT_API_KEY: ${{ secrets.BOUNTY_AGENT_API_KEY }}
        run: python3 scanner.py
      - name: Prepare public Pages artifact
        run: |
          rm -rf public_site
          mkdir -p public_site/store
          cp -R store/. public_site/store/
          mkdir -p public_site/store/data
          for f in data/sales_engine.json data/taskmarket_active.json data/base_payments.json data/sales_experiments.json; do
            if [ -f "$f" ]; then cp "$f" "public_site/store/data/$(basename "$f")"; fi
          done
          mkdir -p public_site/creator
          cp -R content/. public_site/creator/
          cp store/robots.txt public_site/robots.txt
          cp store/sitemap.xml public_site/sitemap.xml
          cat > public_site/index.html <<'HTML'
          <!doctype html><html><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta http-equiv="refresh" content="0; url=store/"><title>EarnAgent Store</title></head><body><a href="store/">Open EarnAgent Store</a></body></html>
          HTML
          test -f public_site/store/index.html
      - uses: actions/configure-pages@v5
        with:
          enablement: true
      - uses: actions/upload-pages-artifact@v4
        with:
          path: public_site
      - id: deployment
        uses: actions/deploy-pages@v4
